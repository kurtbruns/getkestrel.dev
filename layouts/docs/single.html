{{ define "main" }}
<div class="docs">
  <aside class="docs-side">{{ partial "docs-sidebar.html" . }}</aside>
  <article class="docs-body">
    <p class="eyebrow">{{ with .CurrentSection }}<a href="{{ .RelPermalink }}">{{ .Params.docset | default "Docs" }}</a>{{ end }}</p>
    <h1 id="{{ .File.ContentBaseName }}">{{ .Title }}</h1>
    {{ .Content }}
    {{ partial "docs-prevnext.html" . }}
  </article>
</div>
{{ partial "docs-scrollspy.html" . }}
{{ end }}
