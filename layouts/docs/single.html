{{ define "main" }}
<div class="docs">
  <aside class="docs-side">{{ partial "docs-sidebar.html" . }}</aside>
  <article class="docs-body">
    <p class="eyebrow">{{ with site.GetPage "/docs" }}<a href="{{ .RelPermalink }}">Docs</a>{{ end }}</p>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </article>
</div>
{{ partial "docs-scrollspy.html" . }}
{{ end }}
