<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}">
      <img src="{{ "favicon.svg" | relURL }}" alt="" width="24" height="24">
      <span>Kestrel</span>
    </a>
    <nav class="nav">
      {{/* /docs/ when the operator docs are synced (issue #3); otherwise fall
           back to the source-of-truth setup guide on GitHub. */}}
      {{ with site.GetPage "/docs" }}<a class="nav-link" href="{{ .RelPermalink }}">Docs</a>
      {{ else }}<a class="nav-link" href="{{ site.Params.repoApp }}/tree/main/docs/setup">Docs</a>{{ end }}
      <a class="nav-link" href="{{ site.Params.repoApp }}">GitHub</a>
      <a class="btn" href="#quickstart">Self-host</a>
    </nav>
  </div>
</header>
