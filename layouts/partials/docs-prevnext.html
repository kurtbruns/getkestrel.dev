{{- /* The foot pager: Previous and Next with their titles (docs-neighbors.html says which). */ -}}
{{- $n := partial "docs-neighbors.html" . -}}
{{- if or $n.prev $n.next -}}
<nav class="doc-prevnext" aria-label="Previous and next">
  {{ with $n.prev }}<a class="pn prev" href="{{ .RelPermalink }}"><span class="pn-dir">← Previous</span><b>{{ .Title }}</b></a>{{ else }}<span></span>{{ end }}
  {{ with $n.next }}<a class="pn next" href="{{ .RelPermalink }}"><span class="pn-dir">Next →</span><b>{{ .Title }}</b></a>{{ end }}
</nav>
{{- end -}}
