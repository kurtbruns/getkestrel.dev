<footer class="site-footer">
  <div class="wrap">
    <span>&copy; {{ now.Year }} Kurt Bruns</span>
    <span class="spacer"></span>
    {{- /* Same order as the header nav, so the two read as one set. */}}
    <nav class="foot-nav">
      {{ with site.GetPage "/docs" }}<a href="{{ .RelPermalink }}">Docs</a>{{ else }}<a href="{{ site.Params.repoApp }}/tree/main/docs">Docs</a>{{ end }}
      <a href="{{ site.Params.repoApp }}">GitHub</a>
      <a href="{{ "contact/" | relURL }}">Contact</a>
    </nav>
  </div>
</footer>
