{{- $cur := .RelPermalink -}}
{{- with site.GetPage "/docs" -}}
<nav class="docs-nav-inner" aria-label="Documentation">
  <p class="docs-nav-h">Documentation</p>
  <ul>
    <li><a href="{{ .RelPermalink }}"{{ if eq $cur .RelPermalink }} class="active" aria-current="page"{{ end }}>{{ .Title }}</a></li>
    {{ range .Pages.ByWeight }}
    <li><a href="{{ .RelPermalink }}"{{ if eq $cur .RelPermalink }} class="active" aria-current="page"{{ end }}>{{ .Title }}</a></li>
    {{ end }}
  </ul>
</nav>
{{- end -}}
