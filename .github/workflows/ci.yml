name: CI
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-24.04
    # The Cloudflare secrets live in the `production` GitHub Environment; the
    # preview upload needs them, and the env has no branch protection rules so
    # same-repo PR runs can read them.
    environment: production
    # Optional read token for the temporary docs sync (issue #3). Unset ->
    # empty -> the sync step is skipped and the preview builds without /docs/.
    env:
      KESTREL_DOCS_TOKEN: ${{ secrets.KESTREL_DOCS_TOKEN }}
    concurrency:
      group: deploy-preview-${{ github.ref }}
      cancel-in-progress: true
    steps:

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve preview alias
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ALIAS="pr-${PR_NUMBER}-${HEAD_SHA:0:7}"
          {
            echo "PREVIEW_ALIAS=${ALIAS}"
            echo "HUGO_BASEURL=https://${ALIAS}-getkestrel-dev.kurtbruns.workers.dev"
          } >> "$GITHUB_ENV"

      - name: Post preview in-progress comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cf-workers-preview
          only_update: true
          message: |
            ## Deploying getkestrel-dev with Cloudflare Workers

            |  |  |
            | --- | --- |
            | **Latest commit:** | `${{ github.event.pull_request.head.sha }}` |
            | **Status:** | Build in progress... |

            [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read Hugo version from .tool-versions
        id: hugo_version
        run: echo "version=$(grep '^hugo extended_' .tool-versions | sed 's/^hugo extended_//')" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo_version.outputs.version }}
          extended: true

      # Temporary docs ingestion (issue #3): clone kestrel with a read token
      # and sync docs/ into the gitignored content/docs/. Skipped when no token
      # is set (the site just builds without /docs/). Dissolve when kestrel is
      # public + a Hugo Modules mount replaces this.
      - name: Sync operator docs from kestrel
        if: ${{ env.KESTREL_DOCS_TOKEN != '' }}
        run: |
          git clone --depth 1 "https://x-access-token:${KESTREL_DOCS_TOKEN}@github.com/kurtbruns/kestrel.git" .kestrel-src
          KESTREL_DOCS_SRC="$PWD/.kestrel-src" node scripts/sync-docs.mjs

      # HUGO_ENVIRONMENT=preview makes layouts/robots.txt emit Disallow: /
      # so PR preview aliases on *.workers.dev aren't crawlable. HUGO_BASEURL
      # is inherited from $GITHUB_ENV (set in "Resolve preview alias") so
      # Hugo's .Permalink uses the preview hostname.
      - name: Build
        run: hugo --minify
        env:
          HUGO_ENVIRONMENT: preview

      - name: Upload preview version to Cloudflare Workers
        id: wrangler
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            versions upload
            --preview-alias=${{ env.PREVIEW_ALIAS }}
            --message=${{ toJson(github.event.pull_request.title) }}

      - name: Post preview success comment
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cf-workers-preview
          message: |
            ## Deploying getkestrel-dev with Cloudflare Workers

            |  |  |
            | --- | --- |
            | **Latest commit:** | `${{ github.event.pull_request.head.sha }}` |
            | **Status:** | Deployed successfully |
            | **Preview URL:** | ${{ env.HUGO_BASEURL }} |

            [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Post preview failure comment
        if: failure() && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cf-workers-preview
          message: |
            ## Deploying getkestrel-dev with Cloudflare Workers

            |  |  |
            | --- | --- |
            | **Latest commit:** | `${{ github.event.pull_request.head.sha }}` |
            | **Status:** | Build failed |

            [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
