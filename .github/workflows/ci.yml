name: CI
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Build-only check: fail a PR fast if the Hugo build or the kestrel docs sync
  # breaks. No per-PR Cloudflare preview deploy — review happens locally
  # (`npm run serve`) and the real deploy is deploy.yml on `main`. To restore
  # previews, see the history of this file (issue #2's setup).
  ci:
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0    # match the production build (.GitInfo / .Lastmod)

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read Hugo version from .tool-versions
        id: hugo_version
        run: echo "version=$(grep '^hugo extended_' .tool-versions | sed 's/^hugo extended_//')" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo_version.outputs.version }}
          extended: true

      # Docs ingestion (issue #3): clone public kestrel unauthenticated and sync
      # docs/ into the gitignored content/docs/, so the PR build exercises the
      # full docs pipeline. Pinned to the release tag in .kestrel-docs-version
      # (not kestrel's default branch), so the live site only moves when that
      # file is bumped. To bump: edit .kestrel-docs-version → PR → merge.
      - name: Sync operator docs from kestrel
        run: |
          REF="$(cat .kestrel-docs-version)"
          git clone --depth 1 --branch "$REF" https://github.com/kurtbruns/kestrel.git .kestrel-src
          KESTREL_DOCS_SRC="$PWD/.kestrel-src" node scripts/sync-docs.mjs

      - name: Build
        run: hugo --minify
