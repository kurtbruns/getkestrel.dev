# Development-environment overrides. `hugo serve` runs in the `development`
# environment by default, so these apply to the local dev server but NOT to
# the production `hugo` build. The root hugo.toml is still merged in both.
#
# buildDrafts renders draft content on the local dev server without shipping
# it to production.
buildDrafts = true

# Cloudflare's Turnstile test key that always passes, so the contact form works
# against `wrangler dev` without a real widget. Pair it with the always-pass test
# secret in .dev.vars.
[params]
turnstileSiteKey = '1x00000000000000000000AA'
