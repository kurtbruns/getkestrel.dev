baseURL = 'https://getkestrel.dev/'
enableGitInfo = true
enableRobotsTXT = true
locale = 'en-us'
title = 'Kestrel'

[params]
description = 'Run your own Kestrel — a small, self-hosted newsletter app. Write in Markdown, preview the exact email, schedule with a review window, and send to a double opt-in list, while owning the list, the consent, the delivery record, and the archive.'
tagline = 'Own your newsletter.'
repoApp = 'https://github.com/kurtbruns/kestrel'
repoSite = 'https://github.com/kurtbruns/getkestrel.dev'

# No tags/categories on this site — clear Hugo's default taxonomies so it
# doesn't emit empty /tags and /categories term pages and feeds.
[taxonomies]

# Runtime tripwire: Hugo refuses to build if the binary is older than `min`.
# Catches devs who bypass asdf and run a stale local hugo. Keep `min` in
# sync with `.tool-versions`; `npm run hugo:check` verifies they agree.
[module]
  [module.hugoVersion]
    min = "0.164.0"
    extended = true
